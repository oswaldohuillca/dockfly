name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Genera las rutas, revisa los tipos y compila.
      - run: npm run build

  go:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # Los runners de GitHub tienen Docker: también se prueban los builds
      # reales en contenedores (oven/bun).
      - name: Tests
        run: go test -race ./...
        env:
          DOCKFLY_DOCKER_TESTS: "1"

  image:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [web, go]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Comprueba que la imagen se construye para ambas arquitecturas (sin
      # publicarla: de eso se encarga release.yml).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
