services:
  dockfly:
    image: dockfly:latest
    build: .
    container_name: dockfly
    restart: unless-stopped
    ports:
      - "80:80"     # Application HTTP
      - "443:443"   # Application HTTPS
      - "127.0.0.1:81:81"   # Dockfly panel (local only; publish it through a proxy host over HTTPS)
    environment:
      # DOCKFLY_ACME_EMAIL: tu@email.com
      # DOCKFLY_ACME_STAGING: "true"   # use Let's Encrypt's staging environment
      DOCKFLY_NETWORK: dockfly
    volumes:
      - dockfly-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Lets you point at apps running directly on the server.
      - "host.docker.internal:host-gateway"
    networks:
      - dockfly

networks:
  dockfly:
    name: dockfly

volumes:
  dockfly-data:
